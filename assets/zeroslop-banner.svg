<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">ZeroSlop™ by Ribbsaeter Systems — Autonomous CI Pull Request Invariant Gatekeeper</title>
  <desc id="banner-desc">Architectural banner showcasing ZeroSlop on GitHub Marketplace, featuring real-time diff invariant verification, test deletion shield, and diff minimization engine.</desc>
  <defs>
    <style>
      .beam-red{stroke-dasharray:8 14;animation:beamFlow 5s linear infinite}
      .beam-cyan{stroke-dasharray:8 14;animation:beamFlow 5s linear infinite reverse}
      .pulse-core{animation:coreGlow 3s ease-in-out infinite}
      .pulse-dot{animation:dotPulse 2.4s ease-in-out infinite}
      .sheen{animation:sheenPass 9s ease-in-out infinite}
      @keyframes beamFlow{to{stroke-dashoffset:-88}}
      @keyframes coreGlow{0%,100%{opacity:.45;transform:scale(0.98)}50%{opacity:1;transform:scale(1.02)}}
      @keyframes dotPulse{0%,100%{opacity:.35}50%{opacity:1}}
      @keyframes sheenPass{0%,12%{transform:translateX(-320px);opacity:0}22%{opacity:.14}54%{opacity:.05}70%,100%{transform:translateX(1300px);opacity:0}}
      @media (prefers-reduced-motion:reduce){
        .beam-red,.beam-cyan,.pulse-core,.pulse-dot,.sheen{animation:none}
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050811"/>
      <stop offset=".45" stop-color="#09101E"/>
      <stop offset="1" stop-color="#121D30"/>
    </linearGradient>
    <linearGradient id="red-laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E33126"/>
      <stop offset=".6" stop-color="#FF5544"/>
      <stop offset="1" stop-color="#FF8A7A"/>
    </linearGradient>
    <linearGradient id="cyan-laser" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B8D9"/>
      <stop offset=".5" stop-color="#5FE7FF"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>
    <linearGradient id="shield-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E0B0F"/>
      <stop offset="1" stop-color="#0B0609"/>
    </linearGradient>
    <linearGradient id="card-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E33126" stop-opacity=".7"/>
      <stop offset=".45" stop-color="#5FE7FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity=".6"/>
    </linearGradient>

    <!-- Radial Halos -->
    <radialGradient id="halo-left" cx=".15" cy=".2" r=".6">
      <stop offset="0" stop-color="#E33126" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#80120B" stop-opacity=".05"/>
      <stop offset="1" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-right" cx=".85" cy=".5" r=".55">
      <stop offset="0" stop-color="#26D9FF" stop-opacity=".15"/>
      <stop offset=".6" stop-color="#0E4866" stop-opacity=".04"/>
      <stop offset="1" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>

    <!-- Blueprint Grid -->
    <pattern id="arch-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#75DDF0" stroke-opacity=".045"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="card-frame">
      <rect width="1200" height="380" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card-frame)">
    <!-- Background Canvas -->
    <rect width="1200" height="380" fill="url(#bg-grad)"/>
    <rect width="1200" height="380" fill="url(#halo-left)"/>
    <rect width="1200" height="380" fill="url(#halo-right)"/>
    <rect width="1200" height="380" fill="url(#arch-grid)"/>

    <!-- Kinetic Diagonal Sheen -->
    <path class="sheen" d="M-220 0h120L40 380H-80Z" fill="#BFF5FF" opacity="0"/>

    <!-- Architectural Construction Lines -->
    <path d="M0 338H1200" stroke="#75DDF0" stroke-opacity=".10"/>
    <path d="M720 0V380" stroke="#75DDF0" stroke-opacity=".08"/>
    <circle cx="720" cy="338" r="3" fill="#5FE7FF" opacity=".6"/>

    <!-- ══ LEFT COLUMN: BRAND & STRATEGIC POSITIONING ══ -->
    <g transform="translate(68, 0)">
      <!-- Top Pill Badge -->
      <g transform="translate(0, 42)">
        <rect width="362" height="28" rx="14" fill="#1B0A0E" stroke="#E33126" stroke-opacity=".55" stroke-width="1.2"/>
        <circle cx="16" cy="14" r="4.5" fill="#E33126" class="pulse-dot"/>
        <text x="28" y="18" fill="#FF8A7A" font-family="'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.4">FLAGSHIP RELEASE · GITHUB MARKETPLACE · v1.0.0</text>
      </g>

      <!-- Sovereign Logo Monolith -->
      <g transform="translate(0, 126)">
        <text x="0" y="0" fill="#F4F9FF" font-family="'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="56" font-weight="900" letter-spacing="-1.8">ZeroSlop<tspan fill="#E33126">™</tspan></text>
      </g>

      <!-- Signature Swiss Red Laser Rule -->
      <rect x="0" y="142" width="580" height="3" rx="1.5" fill="url(#red-laser)" filter="url(#glow-red)"/>

      <!-- Subtitle -->
      <text x="0" y="172" fill="#5FE7FF" font-family="'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.2">AUTONOMOUS CI PULL REQUEST INVARIANT GATEKEEPER</text>

      <!-- Value Proposition Narrative -->
      <text x="0" y="210" fill="#E1ECF7" font-family="'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15.5" font-weight="500" letter-spacing="-.2">Mechanical AST diff minimization engine engineered for zero-regression CI/CD.</text>
      <text x="0" y="234" fill="#9BB0C7" font-family="'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14.5" font-weight="400">Intercepts AI-generated slop, phantom refactorings, and unauthorized test deletions.</text>

      <!-- 4 High-Impact Invariant Feature Badges -->
      <g transform="translate(0, 268)">
        <!-- Badge 1: Test Deletion Guard -->
        <rect x="0" y="0" width="168" height="26" rx="6" fill="#1C090C" stroke="#E33126" stroke-opacity=".5" stroke-width="1"/>
        <text x="84" y="16.5" text-anchor="middle" fill="#FF8A7A" font-family="Consolas,monospace" font-size="10" font-weight="700" letter-spacing=".6">🛡 ZERO TEST DELETIONS</text>

        <!-- Badge 2: Diff Minimizer -->
        <rect x="176" y="0" width="138" height="26" rx="6" fill="#081622" stroke="#00B8D9" stroke-opacity=".5" stroke-width="1"/>
        <text x="245" y="16.5" text-anchor="middle" fill="#5FE7FF" font-family="Consolas,monospace" font-size="10" font-weight="700" letter-spacing=".6">⚡ DIFF MINIMIZER</text>

        <!-- Badge 3: AST Verifier -->
        <rect x="322" y="0" width="138" height="26" rx="6" fill="#120D22" stroke="#9333EA" stroke-opacity=".5" stroke-width="1"/>
        <text x="391" y="16.5" text-anchor="middle" fill="#C084FC" font-family="Consolas,monospace" font-size="10" font-weight="700" letter-spacing=".6">◈ AST PARSER</text>

        <!-- Badge 4: Multi-OS -->
        <rect x="468" y="0" width="112" height="26" rx="6" fill="#071915" stroke="#10B981" stroke-opacity=".5" stroke-width="1"/>
        <text x="524" y="16.5" text-anchor="middle" fill="#34D399" font-family="Consolas,monospace" font-size="10" font-weight="700" letter-spacing=".6">✓ MULTI-OS CI</text>
      </g>
    </g>

    <!-- ══ RIGHT COLUMN: ARCHITECTURAL INVARIANT GATE SCHEMATIC ══ -->
    <g transform="translate(740, 36)">
      <!-- Circuit Signal Paths -->
      <g fill="none" stroke-width="1.5">
        <path class="beam-red" d="M30 110h80l24 35h46" stroke="url(#red-laser)" opacity=".7"/>
        <path class="beam-cyan" d="M30 190h80l24-35h46" stroke="url(#cyan-laser)" opacity=".7"/>
        <path class="beam-cyan" d="M260 145h60l25-35h50" stroke="url(#cyan-laser)" opacity=".8"/>
        <path class="beam-red" d="M260 145h60l25 35h50" stroke="url(#red-laser)" opacity=".8"/>
      </g>

      <!-- Ingest Node (PR Diff Stream) -->
      <g transform="translate(0, 92)">
        <rect width="130" height="106" rx="12" fill="#070E1A" stroke="#75DDF0" stroke-opacity=".25" stroke-width="1.2"/>
        <rect x="10" y="10" width="110" height="18" rx="4" fill="#0F1F35"/>
        <text x="65" y="22.5" text-anchor="middle" fill="#75DDF0" font-family="Consolas,monospace" font-size="9" font-weight="700" letter-spacing="1">PR DIFF INGEST</text>
        <text x="14" y="48" fill="#FF6E63" font-family="Consolas,monospace" font-size="9.5">+420 lines</text>
        <text x="14" y="64" fill="#7F9BB5" font-family="Consolas,monospace" font-size="9.5">14 touched files</text>
        <text x="14" y="80" fill="#FF8A7A" font-family="Consolas,monospace" font-size="9.5">! test mutations</text>
        <text x="14" y="96" fill="#38BDF8" font-family="Consolas,monospace" font-size="8.5">streaming AST...</text>
      </g>

      <!-- Central Shield Guard (Invariant Filter) -->
      <g transform="translate(180, 95)" class="pulse-core">
        <rect width="100" height="100" rx="20" fill="url(#shield-grad)" stroke="#E33126" stroke-width="1.8" filter="url(#glow-red)"/>
        <!-- Octagonal inner contour -->
        <polygon points="50,14 84,24 84,76 50,86 16,76 16,24" fill="#140608" stroke="#FF5544" stroke-width="1.2" opacity=".8"/>
        <!-- Swiss Invariant Cross -->
        <path d="M44 38h12v24H44z M38 44h24v12H38z" fill="#F4F9FF"/>
        <text x="50" y="72" text-anchor="middle" fill="#FF8A7A" font-family="'Inter',sans-serif" font-size="8" font-weight="800" letter-spacing="1">SHIELD</text>
      </g>

      <!-- Verification Output Node (Exit 0) -->
      <g transform="translate(310, 92)">
        <rect width="115" height="106" rx="12" fill="#061311" stroke="#10B981" stroke-opacity=".4" stroke-width="1.2"/>
        <rect x="8" y="10" width="99" height="18" rx="4" fill="#0D2B24"/>
        <text x="57" y="22.5" text-anchor="middle" fill="#34D399" font-family="Consolas,monospace" font-size="9" font-weight="700" letter-spacing="1">EXIT 0 : GREEN</text>
        <text x="12" y="48" fill="#34D399" font-family="Consolas,monospace" font-size="9.5">✓ Invariants OK</text>
        <text x="12" y="64" fill="#75DDF0" font-family="Consolas,monospace" font-size="9.5">✓ Zero test drop</text>
        <text x="12" y="80" fill="#A7F3D0" font-family="Consolas,monospace" font-size="9.5">✓ Budget checked</text>
        <text x="12" y="96" fill="#10B981" font-family="Consolas,monospace" font-size="8.5">merged to main</text>
      </g>

      <!-- Technical Coordinate Watermark -->
      <text x="424" y="318" text-anchor="end" fill="#627D98" font-family="Consolas,monospace" font-size="10.5" letter-spacing="1.4">RIBBSAETER SYSTEMS · CH / 47.3769° N</text>
    </g>

    <!-- Outer Perimeter Hairline Frame with Luxury Gradient Stroke -->
    <rect x=".75" y=".75" width="1198.5" height="378.5" rx="23.25" fill="none" stroke="url(#card-border)" stroke-width="1.5"/>
  </g>
</svg>
