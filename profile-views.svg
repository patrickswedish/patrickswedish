<!-- refresh-offset: 155 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
  <title id="title">Patrick Ribbsaeter visitor telemetry</title>
  <desc id="desc">133 recorded GitHub profile page hits.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050A12"/>
      <stop offset=".54" stop-color="#081421"/>
      <stop offset="1" stop-color="#0D2033"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00B8D9"/>
      <stop offset=".5" stop-color="#5FE7FF"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".45" r=".55">
      <stop stop-color="#00D5FF" stop-opacity=".16"/>
      <stop offset="1" stop-color="#07111E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#B8D8EE" stroke-opacity=".045"/>
    </pattern>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="210" rx="22"/>
    </clipPath>
    <style>
      .scan{animation:scan 6s ease-in-out infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .flow{stroke-dasharray:7 14;animation:flow 8s linear infinite}
      @keyframes scan{0%,12%{transform:translateX(-240px);opacity:0}32%{opacity:.11}72%{opacity:.04}88%,100%{transform:translateX(1340px);opacity:0}}
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-126}}
      @media(prefers-reduced-motion:reduce){.scan,.pulse,.flow{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="210" fill="url(#panel)"/>
    <rect width="1200" height="210" fill="url(#grid)"/>
    <rect width="1200" height="210" fill="url(#glow)"/>
    <path class="scan" d="M-180 0h105L95 210H-10Z" fill="#C8F8FF" opacity="0"/>

    <rect x="1" y="1" width="1198" height="208" rx="21" fill="none" stroke="#78DFFF" stroke-opacity=".13"/>
    <rect x="0" y="0" width="5" height="210" fill="url(#cyan)"/>
    <path d="M5 1h270" stroke="url(#cyan)" stroke-width="1.5" opacity=".65"/>
    <path d="M1199 209H930" stroke="url(#cyan)" stroke-width="1.5" opacity=".45"/>

    <g transform="translate(58 42)">
      <circle cx="5" cy="5" r="5" fill="#5FE7FF" filter="url(#soft-glow)" class="pulse"/>
      <text x="22" y="10" fill="#8CAFC4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">PROFILE SIGNAL / 001</text>
      <text x="0" y="66" fill="#F4F9FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" letter-spacing="1.8">VISITOR TELEMETRY</text>
      <text x="1" y="97" fill="#7292A8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="2.2">RECORDED PAGE HITS · AUTOMATED REFRESH</text>

      <g transform="translate(0 121)">
        <rect width="222" height="25" rx="12.5" fill="#07101B" stroke="#1C5065"/>
        <circle cx="15" cy="12.5" r="3.5" fill="#46E6B0" class="pulse"/>
        <text x="28" y="17" fill="#A7C8D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">TRACKING ACTIVE</text>
      </g>
    </g>

    <path class="flow" d="M500 105H710" fill="none" stroke="url(#cyan)" stroke-width="1.3" opacity=".38"/>
    <circle cx="500" cy="105" r="3.5" fill="#5FE7FF" opacity=".7"/>
    <circle cx="710" cy="105" r="3.5" fill="#5FE7FF" opacity=".7"/>

    <g transform="translate(754 30)">
      <rect width="388" height="150" rx="18" fill="#050D17" fill-opacity=".82" stroke="#168FB0" stroke-opacity=".68"/>
      <path d="M18 1h138" stroke="url(#cyan)" stroke-width="2"/>
      <path d="M370 149h-86" stroke="url(#cyan)" stroke-width="1.5" opacity=".55"/>

      <text x="30" y="37" fill="#6F91A7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2.6">TOTAL RECORDED VIEWS</text>
      <text id="view-count" x="30" y="96" fill="#F4F9FF" font-family="Consolas,SFMono-Regular,Menlo,monospace" font-size="55" font-weight="700" letter-spacing="7" filter="url(#soft-glow)">000133</text>
      <line x1="30" y1="112" x2="358" y2="112" stroke="#16445A"/>
      <text id="updated-at" x="30" y="137" fill="#54778D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.8">SYNCED 2026-09-05 20:27 UTC</text>

      <g transform="translate(297 126)" fill="#2F81F7">
        <rect width="6" height="8" rx="3" opacity=".35"/>
        <rect x="12" y="-4" width="6" height="12" rx="3" opacity=".55"/>
        <rect x="24" y="-9" width="6" height="17" rx="3" opacity=".75"/>
        <rect x="36" y="-15" width="6" height="23" rx="3"/>
        <rect x="48" y="-7" width="6" height="15" rx="3" opacity=".7"/>
      </g>
    </g>
  </g>
</svg>
