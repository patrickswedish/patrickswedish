<svg xmlns="http://www.w3.org/2000/svg" width="214" height="42" viewBox="0 0 214 42" role="img" aria-labelledby="title-portal desc-portal">
  <title id="title-portal">Visit ZeroSlop Product Portal</title>
  <desc id="desc-portal">Button linking to the ZeroSlop portal on Ribbsaeter Systems.</desc>
  <defs>
    <linearGradient id="bg-portal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1A160B"/>
      <stop offset="1" stop-color="#0E0C06"/>
    </linearGradient>
    <linearGradient id="acc-portal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#F0D060"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="213" height="41" rx="10" fill="url(#bg-portal)" stroke="#D4AF37" stroke-opacity=".38"/>
  <rect width="4" height="42" rx="2" fill="url(#acc-portal)"/>
  <!-- Diamond Compass / System Icon -->
  <g transform="translate(15 11)" fill="none" stroke="#F0D060" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="10,2 18,10 10,18 2,10"/>
    <circle cx="10" cy="10" r="2.5" fill="#F0D060"/>
  </g>
  <text x="44" y="17" fill="#E2C76A" font-family="'Inter',Arial,sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2">RIBBSAETER SYSTEMS</text>
  <text x="44" y="30" fill="#FFFDF5" font-family="'Inter',Arial,sans-serif" font-size="10.5" font-weight="800" letter-spacing=".55">PRODUCT PORTAL</text>
  <text x="195" y="26" text-anchor="middle" fill="#F0D060" font-family="'Inter',Arial,sans-serif" font-size="16" font-weight="700">↗</text>
</svg>
