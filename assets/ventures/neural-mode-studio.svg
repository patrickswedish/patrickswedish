<svg xmlns="http://www.w3.org/2000/svg" width="360" height="116" viewBox="0 0 360 116" role="img" aria-label="Neural Mode Studio">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A0A18"/><stop offset="1" stop-color="#17142D"/></linearGradient>
    <linearGradient id="s"><stop stop-color="#8E78FF" stop-opacity="0"/><stop offset=".5" stop-color="#8E78FF" stop-opacity=".2"/><stop offset="1" stop-color="#8E78FF" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="360" height="116" rx="16"/></clipPath>
    <style>
      .sweep{animation:sweep 18s cubic-bezier(.4,0,.2,1) 4s infinite both}
      .frame{animation:frame 18s ease-in-out 4s infinite both}
      @keyframes sweep{0%{transform:translateX(0);opacity:0}2%{opacity:.7}10%{opacity:.28}12%,100%{transform:translateX(500px);opacity:0}}
      @keyframes frame{0%,12%,100%{stroke-opacity:.48}6%{stroke-opacity:.74}}
      @media(prefers-reduced-motion:reduce){.sweep,.frame{animation:none}.sweep{opacity:0}}
    </style>
  </defs>
  <rect class="frame" x=".5" y=".5" width="359" height="115" rx="16" fill="url(#g)" stroke="#8E78FF" stroke-opacity=".48"/>
  <g clip-path="url(#c)"><g transform="skewX(-18)"><rect class="sweep" x="-140" width="92" height="116" fill="url(#s)"/></g></g>
  <rect x="24" y="20" width="42" height="2" rx="1" fill="#8E78FF"/>
  <text x="180" y="66" fill="#F7F7FF" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing=".5" text-anchor="middle">NEURAL MODE STUDIO</text>
</svg>
