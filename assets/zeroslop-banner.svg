<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">ZeroSlop™ by Ribbsaeter Systems — Autonomous CI Pull Request Invariant Gatekeeper</title>
  <desc id="banner-desc">Precision architectural banner showcasing ZeroSlop on GitHub Marketplace, featuring real-time diff invariant verification, test deletion shield, and diff minimization engine.</desc>
  <defs>
    <style>
      .signal{stroke-dasharray:10 18;animation:signalFlow 7s linear infinite}
      .node-a{animation:nodePulse 2.8s ease-in-out infinite}
      .node-b{animation:nodePulse 2.8s ease-in-out 1.4s infinite}
      .orbit{transform-origin:1018px 190px;animation:orbitSpin 18s linear infinite}
      .orbit-reverse{transform-origin:1018px 190px;animation:orbitSpin 12s linear infinite reverse}
      .core{animation:corePulse 3.6s ease-in-out infinite}
      .scan{animation:scanMove 8s ease-in-out infinite}
      @keyframes signalFlow{to{stroke-dashoffset:-112}}
      @keyframes nodePulse{0%,100%{opacity:.38}50%{opacity:1}}
      @keyframes orbitSpin{to{transform:rotate(360deg)}}
      @keyframes corePulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes scanMove{0%,12%{transform:translateX(-260px);opacity:0}24%{opacity:.12}55%{opacity:.06}72%,100%{transform:translateX(1220px);opacity:0}}
      @media (prefers-reduced-motion:reduce){
        .signal,.node-a,.node-b,.orbit,.orbit-reverse,.core,.scan{animation:none}
      }
    </style>

    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050A12"/>
      <stop offset=".58" stop-color="#0A1423"/>
      <stop offset="1" stop-color="#10243A"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00B8D9"/>
      <stop offset=".5" stop-color="#5FE7FF"/>
      <stop offset="1" stop-color="#2F81F7"/>
    </linearGradient>

    <radialGradient id="halo" cx=".86" cy=".18" r=".72">
      <stop offset="0" stop-color="#26D9FF" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#1379A5" stop-opacity=".05"/>
      <stop offset="1" stop-color="#07111E" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B8D8EE" stroke-opacity=".05"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="1200" height="380" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Base Background & Grid -->
    <rect width="1200" height="380" fill="url(#background)"/>
    <rect width="1200" height="380" fill="url(#halo)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <path class="scan" d="M-180 0h110L90 380H-20Z" fill="#BFF5FF" opacity="0"/>

    <!-- Architectural Construction Guidelines -->
    <path d="M0 342H1200" stroke="#A8DFF0" stroke-opacity=".10"/>
    <path d="M720 0V380" stroke="#A8DFF0" stroke-opacity=".06"/>

    <!-- ══ RIGHT SIDE: PRECISION KINETIC INVARIANT AIRLOCK RADAR ══ -->
    <g class="signal" opacity=".58" fill="none" stroke="url(#cyan)" stroke-width="1.5">
      <path d="M790 76h95l28 28h112"/>
      <path d="M750 130h80l30 30h180"/>
      <path d="M830 256h80l30-30h145"/>
      <path d="M770 306h110l26-26h95"/>
      <circle class="node-a" cx="790" cy="76" r="3.5" fill="#5FE7FF" stroke="none"/>
      <circle class="node-b" cx="1025" cy="104" r="3.5" fill="#2F81F7" stroke="none"/>
      <circle class="node-b" cx="750" cy="130" r="3.5" fill="#00B8D9" stroke="none"/>
      <circle class="node-a" cx="1040" cy="160" r="3.5" fill="#5FE7FF" stroke="none"/>
      <circle class="node-a" cx="830" cy="256" r="3.5" fill="#2F81F7" stroke="none"/>
      <circle class="node-b" cx="1085" cy="226" r="3.5" fill="#00B8D9" stroke="none"/>
    </g>

    <g>
      <!-- Outer Concentric Measurement Rings -->
      <circle cx="1018" cy="190" r="86" fill="#07111D" stroke="#5FE7FF" stroke-opacity=".16"/>
      <circle class="orbit" cx="1018" cy="190" r="74" fill="none" stroke="url(#cyan)" stroke-width="1.4" stroke-dasharray="52 18 6 24"/>
      <circle class="orbit-reverse" cx="1018" cy="190" r="52" fill="none" stroke="#5FE7FF" stroke-opacity=".50" stroke-width="1.2" stroke-dasharray="22 14"/>
      
      <!-- Planetary Nodes -->
      <g class="orbit">
        <circle cx="1018" cy="116" r="5" fill="#5FE7FF"/>
        <circle cx="1082" cy="226" r="4.5" fill="#2F81F7"/>
        <circle cx="954" cy="226" r="4" fill="#00B8D9"/>
      </g>

      <!-- Central Hexagonal Invariant Airlock Core -->
      <g class="core">
        <path d="m1018 156 30 17v34l-30 17-30-17v-34Z" fill="#0A2031" stroke="url(#cyan)" stroke-width="2"/>
        <circle cx="1018" cy="190" r="13" fill="url(#cyan)"/>
        <circle cx="1018" cy="190" r="4.5" fill="#F4F9FF"/>
      </g>

      <!-- Reticle Crosshairs -->
      <path d="M930 190h32m92 0h32M1018 102v32m0 92v32" stroke="#5FE7FF" stroke-opacity=".28" stroke-dasharray="4 8"/>
    </g>

    <!-- ══ LEFT SIDE: EXECUTIVE TYPOGRAPHY & POSITIONING ══ -->
    <g font-family="'Inter',-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
      <!-- Eyebrow Pill -->
      <g transform="translate(68, 52)">
        <rect width="378" height="26" rx="13" fill="#0A1828" stroke="#5FE7FF" stroke-opacity=".35" stroke-width="1"/>
        <circle cx="14" cy="13" r="4" fill="#5FE7FF"/>
        <text x="26" y="17" fill="#75DDF0" font-size="10.5" font-weight="700" letter-spacing="1.5">FLAGSHIP CI INFRASTRUCTURE · MARKETPLACE v1.0.0</text>
      </g>

      <!-- Monolith Title -->
      <text x="66" y="146" fill="#F4F9FF" font-size="58" font-weight="900" letter-spacing="-1.8">ZeroSlop<tspan fill="#5FE7FF">™</tspan></text>

      <!-- Laser Divider -->
      <rect x="68" y="162" width="560" height="3" rx="1.5" fill="url(#cyan)" filter="url(#glow)"/>

      <!-- Subtitle -->
      <text x="68" y="196" fill="#75DDF0" font-size="13" font-weight="700" letter-spacing="2.4">AUTONOMOUS CI PULL REQUEST INVARIANT GATEKEEPER</text>

      <!-- Value Proposition Narrative -->
      <text x="68" y="232" fill="#E1ECF7" font-size="15" font-weight="500" letter-spacing="-.2">Mechanical AST diff minimization engine engineered for zero-regression CI/CD.</text>
      <text x="68" y="256" fill="#8EA8C3" font-size="13.5" font-weight="400">Guarantees deterministic invariant integrity, zero unauthorized test drops, and clean PR diffs.</text>

      <!-- Capabilities Row -->
      <g transform="translate(68, 286)" font-family="Consolas,monospace" font-size="10.5" font-weight="700">
        <rect x="0" y="0" width="168" height="26" rx="6" fill="#0A1826" stroke="#5FE7FF" stroke-opacity=".3" stroke-width="1"/>
        <text x="84" y="17" text-anchor="middle" fill="#5FE7FF" letter-spacing=".6">🛡 12-SHIELD CWE AIRLOCK</text>

        <rect x="178" y="0" width="134" height="26" rx="6" fill="#0A1826" stroke="#5FE7FF" stroke-opacity=".3" stroke-width="1"/>
        <text x="245" y="17" text-anchor="middle" fill="#75DDF0" letter-spacing=".6">⚡ DIFF MINIMIZER</text>

        <rect x="322" y="0" width="160" height="26" rx="6" fill="#0A1826" stroke="#5FE7FF" stroke-opacity=".3" stroke-width="1"/>
        <text x="402" y="17" text-anchor="middle" fill="#A8DFF0" letter-spacing=".6">✓ ZERO TEST DELETIONS</text>
      </g>
    </g>

    <!-- Technical Watermark Coordinates -->
    <text x="1132" y="354" text-anchor="end" fill="#6D8BA5" font-family="Consolas,monospace" font-size="11" letter-spacing="1.6">RIBBSAETER SYSTEMS · ZÜRICH · CH / 47.3769° N</text>

    <!-- Outer Perimeter Hairline Frame -->
    <rect x=".75" y=".75" width="1198.5" height="378.5" rx="25.25" fill="none" stroke="#5FE7FF" stroke-opacity=".22" stroke-width="1.5"/>
  </g>
</svg>
