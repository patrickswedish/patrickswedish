<svg xmlns="http://www.w3.org/2000/svg" width="188" height="40" viewBox="0 0 188 40" role="img" aria-labelledby="title-press desc-press">
  <title id="title-press">Read ZeroSlop Launch Press Release</title>
  <desc id="desc-press">Button linking to the official ZeroSlop launch dispatch on Ribbsaeter Systems Journal.</desc>
  <defs>
    <linearGradient id="bg-press" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121824"/>
      <stop offset="1" stop-color="#0A0F17"/>
    </linearGradient>
    <linearGradient id="acc-press" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7F9BB5"/>
      <stop offset="1" stop-color="#C8D8E8"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="187" height="39" rx="10" fill="url(#bg-press)" stroke="#7F9BB5" stroke-opacity=".38"/>
  <rect width="4" height="40" rx="2" fill="url(#acc-press)"/>
  <!-- Journal / Document Icon -->
  <g transform="translate(13 10)" fill="none" stroke="#C8D8E8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 2h10l4 4v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
    <path d="M14 2v4h4M6 10h8M6 14h6"/>
  </g>
  <text x="40" y="16" fill="#9BB0C7" font-family="'Inter',Arial,sans-serif" font-size="7" font-weight="700" letter-spacing="1.1">OFFICIAL DISPATCH</text>
  <text x="40" y="28" fill="#F4F9FF" font-family="'Inter',Arial,sans-serif" font-size="9.5" font-weight="800" letter-spacing=".5">READ PRESS RELEASE</text>
  <text x="172" y="25" text-anchor="middle" fill="#C8D8E8" font-family="'Inter',Arial,sans-serif" font-size="15" font-weight="700">↗</text>
</svg>
