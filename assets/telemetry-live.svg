<svg xmlns="http://www.w3.org/2000/svg" width="168" height="28" viewBox="0 0 168 28" role="img" aria-label="Telemetry: Live Online">
  <defs>
    <style>
      .pulse-dot {
        animation: radar-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      .beacon-ring {
        animation: ring-expand 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        transform-origin: 18px 14px;
      }
      .glow-text {
        animation: text-breathe 4s ease-in-out infinite;
      }
      @keyframes radar-pulse {
        0%, 100% { opacity: 1; fill: #00F0FF; }
        50% { opacity: 0.45; fill: #5FE7FF; }
      }
      @keyframes ring-expand {
        0% { r: 3.5px; opacity: 0.9; stroke-width: 1.5; }
        70% { r: 8px; opacity: 0; stroke-width: 0.5; }
        100% { r: 8px; opacity: 0; stroke-width: 0; }
      }
      @keyframes text-breathe {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-dot, .beacon-ring, .glow-text { animation: none; }
      }
    </style>
    <linearGradient id="telemetry-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08131F" />
      <stop offset="100%" stop-color="#050A12" />
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Shell with Cyan Border -->
  <rect x="0.5" y="0.5" width="167" height="27" rx="4" fill="url(#telemetry-bg)" stroke="#00B8D9" stroke-opacity="0.6" stroke-width="1" />

  <!-- Animated Radar Beacon -->
  <circle class="beacon-ring" cx="18" cy="14" r="4" fill="none" stroke="#00F0FF" />
  <circle class="pulse-dot" cx="18" cy="14" r="3.5" fill="#00F0FF" filter="url(#cyan-glow)" />

  <!-- Label -->
  <text class="glow-text" x="32" y="17.5" fill="#E2F1F8" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="800" letter-spacing="1.2">
    LIVE TELEMETRY
  </text>
</svg>
