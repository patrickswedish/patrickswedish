<svg xmlns="http://www.w3.org/2000/svg" width="214" height="42" viewBox="0 0 214 42" role="img" aria-labelledby="title-repo desc-repo">
  <title id="title-repo">View ZeroSlop Engine Repository</title>
  <desc id="desc-repo">Button linking to the official ZeroSlop GitHub repository.</desc>
  <defs>
    <linearGradient id="bg-repo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0A1626"/>
      <stop offset="1" stop-color="#050B14"/>
    </linearGradient>
    <linearGradient id="acc-repo" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00B8D9"/>
      <stop offset="1" stop-color="#5FE7FF"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="213" height="41" rx="10" fill="url(#bg-repo)" stroke="#00B8D9" stroke-opacity=".38"/>
  <rect width="4" height="42" rx="2" fill="url(#acc-repo)"/>
  <!-- Git PR / Code Branch Icon -->
  <g transform="translate(15 11)" fill="none" stroke="#5FE7FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5" cy="5" r="2.5"/>
    <circle cx="5" cy="15" r="2.5"/>
    <circle cx="15" cy="7" r="2.5"/>
    <path d="M5 7.5v5M15 9.5a5 5 0 0 1-5 5H7.5"/>
  </g>
  <text x="44" y="17" fill="#88D5E8" font-family="'Inter',Arial,sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.2">OPEN SOURCE CORE</text>
  <text x="44" y="30" fill="#F4FBFF" font-family="'Inter',Arial,sans-serif" font-size="10.5" font-weight="800" letter-spacing=".55">INSPECT ENGINE</text>
  <text x="195" y="26" text-anchor="middle" fill="#5FE7FF" font-family="'Inter',Arial,sans-serif" font-size="16" font-weight="700">↗</text>
</svg>
