<svg xmlns="http://www.w3.org/2000/svg" width="188" height="40" viewBox="0 0 188 40" role="img" aria-labelledby="title-portal desc-portal">
  <title id="title-portal">Visit ZeroSlop Product Portal</title>
  <desc id="desc-portal">Button linking to the ZeroSlop portal on Ribbsaeter Systems.</desc>
  <defs>
    <linearGradient id="bg-portal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1A160B"/>
      <stop offset="1" stop-color="#0E0C06"/>
    </linearGradient>
    <linearGradient id="acc-portal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#F0D060"/>
    </linearGradient>
  </defs>
  <rect x=".5" y=".5" width="187" height="39" rx="10" fill="url(#bg-portal)" stroke="#D4AF37" stroke-opacity=".38"/>
  <rect width="4" height="40" rx="2" fill="url(#acc-portal)"/>
  <!-- Diamond Compass / System Icon -->
  <g transform="translate(13 10)" fill="none" stroke="#F0D060" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="10,2 18,10 10,18 2,10"/>
    <circle cx="10" cy="10" r="2.5" fill="#F0D060"/>
  </g>
  <text x="40" y="16" fill="#E2C76A" font-family="'Inter',Arial,sans-serif" font-size="7" font-weight="700" letter-spacing="1.1">RIBBSAETER SYSTEMS</text>
  <text x="40" y="28" fill="#FFFDF5" font-family="'Inter',Arial,sans-serif" font-size="9.5" font-weight="800" letter-spacing=".5">PRODUCT PORTAL</text>
  <text x="172" y="25" text-anchor="middle" fill="#F0D060" font-family="'Inter',Arial,sans-serif" font-size="15" font-weight="700">↗</text>
</svg>
